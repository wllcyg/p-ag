services:
  # 猫猫 Agent - NestJS 后端服务
  cat-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cat-agent-server
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - ./server/.env
    environment:
      - NODE_ENV=production
      - PORT=7860
    # 保证容器时间与宿主机一致
    volumes:
      - /etc/localtime:/etc/localtime:ro
