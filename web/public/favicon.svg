<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 圆角矩形底座 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#glow)"/>

  <!-- 猫耳 -->
  <path d="M34 52 L42 26 C43 23 47 23 49 26 L62 48 Z" fill="#ffffff"/>
  <path d="M94 52 L86 26 C85 23 81 23 79 26 L66 48 Z" fill="#ffffff"/>
  <!-- 耳内浅色 -->
  <path d="M38 48 L43 32 C44 30 46 30 47 32 L56 46 Z" fill="#e0e7ff"/>
  <path d="M90 48 L85 32 C84 30 82 30 81 32 L72 46 Z" fill="#e0e7ff"/>

  <!-- 猫脸轮廓 -->
  <ellipse cx="64" cy="68" rx="38" ry="32" fill="#ffffff"/>

  <!-- 科技感智能眼镜框 -->
  <rect x="30" y="54" width="30" height="20" rx="6" fill="#1e293b"/>
  <rect x="68" y="54" width="30" height="20" rx="6" fill="#1e293b"/>
  <rect x="58" y="61" width="12" height="4" rx="2" fill="#1e293b"/>
  <!-- 眼镜镜片反光 -->
  <rect x="33" y="57" width="24" height="14" rx="4" fill="url(#glassGrad)"/>
  <rect x="71" y="57" width="24" height="14" rx="4" fill="url(#glassGrad)"/>
  <circle cx="41" cy="62" r="2.5" fill="#ffffff"/>
  <circle cx="79" cy="62" r="2.5" fill="#ffffff"/>

  <!-- 猫鼻 & 嘴巴 -->
  <path d="M64 80 L60 76 C59 75 69 75 68 76 Z" fill="#475569"/>
  <path d="M64 80 Q60 86 54 83 M64 80 Q68 86 74 83" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- 胡须 -->
  <path d="M26 76 L14 74 M26 80 L16 83" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M102 76 L114 74 M102 80 L112 83" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
</svg>